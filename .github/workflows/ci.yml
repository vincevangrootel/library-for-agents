name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r requirements.txt
      - name: compile
        run: python -m compileall -q library.py ingest tools scripts template/tools example tests
      - name: safety tests
        run: python tests/test_safety.py
      - name: no books or generated data in this repo
        run: |
          bad=$(git ls-files | grep -E '\.(epub|npz|jsonl|pdf|mobi|azw3?)$' | grep -v '^example/' || true)
          [ -z "$bad" ] || { echo "refusing: $bad"; exit 1; }
      - name: secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
